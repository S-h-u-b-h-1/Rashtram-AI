name: Research corpus processing

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Maximum documents to process
        required: true
        default: "75"
        type: string
      concurrency:
        description: Worker concurrency (1-4 recommended)
        required: true
        default: "3"
        type: string
      resume_only:
        description: Consume queued work without adding documents
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "15 */6 * * *"

concurrency:
  group: rashtram-research-corpus
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      # AI_PROVIDER was previously unset here. That silently broke OCR for
      # every scanned PDF: extractTextWithOcr() only takes the Gemini path
      # when GEMINI_API_KEY is present, and getOpenAI() refuses to run
      # unless AI_PROVIDER is explicitly "openai". With neither set, all
      # 326 OCR-requiring documents failed and could never become
      # research-ready.
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_FALLBACK_MODEL: gemini-2.5-flash
      GEMINI_OCR_MODEL: gemini-2.5-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      OPENAI_MODEL: gpt-5.4-mini
      OPENAI_FALLBACK_MODEL: gpt-4.1-mini
      OPENAI_OCR_MODEL: gpt-5.4-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-large
      # Was "openai" while production runs Gemini-first. Because
      # VECTOR_NAMESPACE falls back to `${EMBEDDING_MODEL}-${DIM}-v1` when
      # PINECONE_NAMESPACE is unset, that combination derives
      # "text-embedding-3-large-768-v1" here while the API reads
      # "gemini-embedding-001-768-v1" — vectors written into a namespace
      # production never queries. Align the provider AND pin the namespace
      # from the same secret the API uses so the two cannot drift again.
      EMBEDDING_PROVIDER: gemini
      PINECONE_NAMESPACE: ${{ secrets.PINECONE_NAMESPACE }}
      PINECONE_INDEX_NAME: rashtram-bills
      PINECONE_ACT_INDEX_NAME: rashtram-acts
      PROCESSING_CONCURRENCY: "3"
      PROCESSING_SOURCE_CONCURRENCY: "2"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # Runs before migrations and before any job is dequeued. A
      # misconfigured run is worse than no run: it burns queue attempts,
      # advances retry counters toward dead-letter, and writes partial
      # state. This is what was missing when 326 documents failed OCR.
      - name: Verify processing configuration
        run: npm run process:verify-config

      - name: Apply additive database migrations
        run: npm run db:migrate

      - name: Process prioritized corpus batch
        shell: bash
        run: |
          BATCH_SIZE="${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '75' }}"
          WORKERS="${{ github.event_name == 'workflow_dispatch' && inputs.concurrency || '3' }}"
          EXTRA_ARGS="--only-unprocessed"
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.resume_only || 'false' }}" == "true" ]]; then
            EXTRA_ARGS="--resume"
          fi
          npm run process:documents -- \
            --limit="$BATCH_SIZE" \
            --concurrency="$WORKERS" \
            --source-concurrency=2 \
            $EXTRA_ARGS

      - name: Report corpus status
        if: always()
        run: npm run process:status
